<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 950" width="920" height="950"
     role="img" aria-label="BinderFlow DAG: a sample sheet fans out through RFdiffusion, ProteinMPNN, ColabFold and developability features once per design, then gathers into a single ranking task.">
  <title>BinderFlow workflow DAG</title>
  <desc>Five Nextflow processes run top to bottom. rf_diffusion consumes one validated row per sample and the RFdiffusion checkpoint, emitting backbones, metadata and reports. A flatMap splits its backbones so protein_mpnn, predict_complex and developability_features each run once per backbone. rank_candidates collects every features file with config/ranking.json and emits the ranked tables and FASTA. A dashed line marks where --stop_after rfdiffusion ends the run.</desc>

  <style>
    .bg   { fill: #ffffff; }
    .fg   { fill: #1f2937; }
    .mut  { fill: #57606a; }
    .acc  { fill: #0969da; }
    .proc { fill: #f6f8fa; stroke: #8c959f; }
    .data { fill: none;    stroke: #a8b1bb; stroke-dasharray: 5 4; }
    .edge { stroke: #6e7781; fill: none; }
    .cut  { stroke: #0969da; stroke-dasharray: 7 6; opacity: .65; }
    .ahd  { fill: #6e7781; }

    .t-proc { font: 700 14.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-eng  { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t-src  { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-io   { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-edge { font: italic 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t-badge{ font: 700 9.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .4px; }

    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .fg   { fill: #e6edf3; }
      .mut  { fill: #9198a1; }
      .acc  { fill: #4493f8; }
      .proc { fill: #161b22; stroke: #3d444d; }
      .data { stroke: #4d5560; }
      .edge { stroke: #7d8590; }
      .cut  { stroke: #4493f8; }
      .ahd  { fill: #7d8590; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon class="ahd" points="0,0 10,4 0,8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="950"/>

  <!-- ============ input ============ -->
  <rect class="data" x="300" y="20" width="300" height="56" rx="6"/>
  <text class="t-io fg"  x="316" y="44">sample-sheet.csv</text>
  <text class="t-io mut" x="316" y="62">id, target_pdb, contigs, hotspots</text>

  <line class="edge" x1="450" y1="76" x2="450" y2="132" marker-end="url(#a)"/>
  <text class="t-edge mut" x="462" y="110">one validated row per sample</text>

  <!-- ============ rf_diffusion ============ -->
  <rect class="proc" x="300" y="136" width="300" height="84" rx="6"/>
  <text class="t-proc fg" x="316" y="164">rf_diffusion</text>
  <text class="t-eng mut" x="316" y="184">RFdiffusion &#8212; binder backbone generation</text>
  <text class="t-src mut" x="316" y="204">modules/rf_diffusion.nf</text>
  <text class="t-badge acc" x="584" y="160" text-anchor="end">GPU</text>

  <rect class="data" x="50" y="154" width="220" height="48" rx="6"/>
  <text class="t-io fg"  x="64" y="174">--models</text>
  <text class="t-io mut" x="64" y="190">Complex_base_ckpt.pt</text>
  <line class="edge" x1="270" y1="178" x2="296" y2="178" marker-end="url(#a)"/>

  <rect class="data" x="630" y="142" width="270" height="72" rx="6"/>
  <text class="t-io fg" x="644" y="164">backbones/*.pdb</text>
  <text class="t-io fg" x="644" y="182">metadata/*.trb</text>
  <text class="t-io fg" x="644" y="200">reports/ manifest, run, log</text>
  <line class="edge" x1="600" y1="178" x2="626" y2="178" marker-end="url(#a)"/>

  <!-- ============ stop_after boundary ============ -->
  <line class="cut" x1="40" y1="268" x2="900" y2="268"/>
  <text class="t-edge acc" x="40" y="262">--stop_after rfdiffusion &#183; the run ends here</text>

  <line class="edge" x1="450" y1="220" x2="450" y2="296" marker-end="url(#a)"/>
  <text class="t-edge mut" x="462" y="238">flatMap: num_designs backbones per sample</text>

  <!-- ============ protein_mpnn ============ -->
  <rect class="proc" x="300" y="300" width="300" height="84" rx="6"/>
  <text class="t-proc fg" x="316" y="328">protein_mpnn</text>
  <text class="t-eng mut" x="316" y="348">ProteinMPNN &#8212; binder chain sequence design</text>
  <text class="t-src mut" x="316" y="368">modules/protein_mpnn.nf</text>
  <text class="t-badge acc" x="584" y="324" text-anchor="end">GPU</text>

  <rect class="data" x="630" y="322" width="270" height="40" rx="6"/>
  <text class="t-io fg" x="644" y="346">sequences/&lt;backbone_id&gt;/</text>
  <line class="edge" x1="600" y1="342" x2="626" y2="342" marker-end="url(#a)"/>

  <line class="edge" x1="450" y1="384" x2="450" y2="460" marker-end="url(#a)"/>
  <text class="t-edge mut" x="462" y="428">sequences_per_backbone candidates, batched</text>

  <!-- ============ predict_complex ============ -->
  <rect class="proc" x="300" y="464" width="300" height="84" rx="6"/>
  <text class="t-proc fg" x="316" y="492">predict_complex</text>
  <text class="t-eng mut" x="316" y="512">ColabFold AF2-multimer &#8212; binder&#8211;target complex</text>
  <text class="t-src mut" x="316" y="532">modules/af.nf</text>
  <text class="t-badge acc" x="584" y="488" text-anchor="end">GPU</text>

  <rect class="data" x="50" y="482" width="220" height="48" rx="6"/>
  <text class="t-io fg"  x="64" y="502">--colabfold_models</text>
  <text class="t-io mut" x="64" y="518">multimer-v3 params</text>
  <line class="edge" x1="270" y1="506" x2="296" y2="506" marker-end="url(#a)"/>

  <rect class="data" x="630" y="486" width="270" height="40" rx="6"/>
  <text class="t-io fg" x="644" y="510">predictions/&lt;backbone_id&gt;/</text>
  <line class="edge" x1="600" y1="506" x2="626" y2="506" marker-end="url(#a)"/>

  <line class="edge" x1="450" y1="548" x2="450" y2="624" marker-end="url(#a)"/>
  <text class="t-edge mut" x="462" y="592">rank-one model + designed backbone</text>

  <!-- ============ developability_features ============ -->
  <rect class="proc" x="300" y="628" width="300" height="84" rx="6"/>
  <text class="t-proc fg" x="316" y="656">developability_features</text>
  <text class="t-eng mut" x="316" y="676">Biopython &#8212; confidence, interface, sequence</text>
  <text class="t-src mut" x="316" y="696">modules/ranker.nf</text>
  <text class="t-badge mut" x="584" y="652" text-anchor="end">CPU</text>

  <rect class="data" x="630" y="650" width="270" height="40" rx="6"/>
  <text class="t-io fg" x="644" y="674">features/&lt;id&gt;.features.json</text>
  <line class="edge" x1="600" y1="670" x2="626" y2="670" marker-end="url(#a)"/>

  <line class="edge" x1="450" y1="712" x2="450" y2="788" marker-end="url(#a)"/>
  <text class="t-edge mut" x="462" y="756">collect(): every design, one task</text>

  <!-- ============ rank_candidates ============ -->
  <rect class="proc" x="300" y="792" width="300" height="84" rx="6"/>
  <text class="t-proc fg" x="316" y="820">rank_candidates</text>
  <text class="t-eng mut" x="316" y="840">within-target percentile score + gates</text>
  <text class="t-src mut" x="316" y="860">modules/ranker.nf</text>
  <text class="t-badge mut" x="584" y="816" text-anchor="end">CPU</text>

  <rect class="data" x="50" y="810" width="220" height="48" rx="6"/>
  <text class="t-io fg"  x="64" y="830">config/ranking.json</text>
  <text class="t-io mut" x="64" y="846">gates + metric weights</text>
  <line class="edge" x1="270" y1="834" x2="296" y2="834" marker-end="url(#a)"/>

  <rect class="data" x="630" y="790" width="270" height="88" rx="6"/>
  <text class="t-io fg" x="644" y="812">ranked_candidates.csv</text>
  <text class="t-io fg" x="644" y="830">ranked_candidates.json</text>
  <text class="t-io fg" x="644" y="848">ranked_binders.fasta</text>
  <text class="t-io fg" x="644" y="866">ranking_method.json</text>
  <line class="edge" x1="600" y1="834" x2="626" y2="834" marker-end="url(#a)"/>

  <!-- ============ legend ============ -->
  <rect class="proc" x="40" y="906" width="26" height="16" rx="4"/>
  <text class="t-eng mut" x="74" y="918">Nextflow process</text>

  <rect class="data" x="196" y="906" width="26" height="16" rx="4"/>
  <text class="t-eng mut" x="230" y="918">files on a channel</text>

  <line class="cut" x1="356" y1="914" x2="382" y2="914"/>
  <text class="t-eng mut" x="390" y="918">optional cut-off</text>

  <text class="t-badge acc" x="508" y="918">GPU</text>
  <text class="t-eng mut" x="536" y="918">accelerated stage, serialised by --max_forks</text>
</svg>
