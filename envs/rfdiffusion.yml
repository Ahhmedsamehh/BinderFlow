name: binderflow-rfdiffusion
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.9
  - pytorch=1.12.1
  # MKL >= 2024.1 dropped iJIT_NotifyEvent, which PyTorch 1.12 conda builds still link against.
  - mkl=2024.0
  - cudatoolkit=11.6
  - numpy=1.23
  - scipy=1.10
  - hydra-core=1.3
  - pip
  # Runtime stack pinned to match containers/Dockerfile. RFdiffusion and NVIDIA's
  # SE3Transformer are imported from the checkout that --rfdiffusion_script points
  # into, so no local paths are baked in here.
  - pip:
      - --find-links https://data.dgl.ai/wheels/cu116/repo.html
      - dgl==1.0.2+cu116
      - e3nn==0.3.3
      - wandb==0.12.0
      - protobuf==3.20.3
      - pynvml==11.0.0
      - decorator==5.1.0
      - pyrsistent==0.19.3
      - git+https://github.com/NVIDIA/dllogger@0478734ff7be75adde8d160e04872664d1c62e5f
